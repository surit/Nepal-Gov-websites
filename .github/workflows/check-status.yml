name: 🔍 Check Website Status

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging  # Check staging branch first

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Run status checker
        run: node scripts/check-status.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR if changes detected
        if: steps.check-status.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b auto/status-update-$(date +%Y%m%d)
          git add js/script.js
          git commit -m "chore: auto-update website statuses [bot]"
          gh pr create \
            --base staging \
            --head auto/status-update-$(date +%Y%m%d) \
            --title "🤖 Auto: Website Status Update $(date +%Y-%m-%d)" \
            --body "Automated status check found changes. Please review before merging." \
            --label "automated"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
